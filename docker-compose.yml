services:
  # ==========================================
  # Backend .NET 8 con SQLite
  # ==========================================
  api:
    build:
      context: ./Meta-xi-Api-main/Meta-xi-Api-main
      dockerfile: Dockerfile
    container_name: trading-api
    restart: unless-stopped
    env_file:
      - .env

    volumes:
      - sqlite-data:/app/Data
    ports:
      - "5000:5071"
    networks:
      - trading-net

  # ==========================================
  # Frontend Angular + Nginx (reverse proxy)
  # ==========================================
  client:
    build:
      context: ./Meta-xi-Client-main/Meta-xi-Client-main
      dockerfile: Dockerfile
    container_name: trading-client
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - trading-net

  # ==========================================
  # Telegram Bot (Python)
  # ==========================================
  bot:
    build:
      context: ./Bot
      dockerfile: Dockerfile
    container_name: trading-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - api
    networks:
      - trading-net
  botsupport:
    build:
      context: ./SupportBot
      dockerfile: Dockerfile
    container_name: support-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - api
    networks:
      - trading-net

volumes:
  sqlite-data:

networks:
  trading-net:
    driver: bridge